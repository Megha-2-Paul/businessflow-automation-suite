[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "businessflow-automation-suite"
version = "0.1.0"
description = "A modular Python application for small-business operations automation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary project; third-party datasets retain their original licences." }
dependencies = [
    "streamlit>=1.40,<2",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "plotly>=5.24,<7",
    "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.8,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "database*", "ui*", "services*", "automation*", "processing*", "invoices*", "orders*", "inventory*", "reporting*", "validation*", "logging_config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
