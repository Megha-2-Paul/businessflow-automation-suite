name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python files
        run: python -m compileall -q app.py config database logging_config ui processing validation services invoices orders inventory reporting tests
      - name: Check imports
        run: python -c "import app; import config.settings; import database.models; import database.session; import logging_config.setup; import ui.navigation; import ui.styles; import processing.cleaning; import processing.spreadsheets; import validation.spreadsheets; import services.spreadsheet_service; import services.invoice_service; import invoices.extraction; import orders.validation; import services.order_service; import services.inventory_service; import inventory.validation; import reporting.service; import reporting.exports"
      - name: Run Ruff
        run: ruff check .
      - name: Run tests
        run: pytest
      - name: Verify Streamlit app starts
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 15); do
            if python -c "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=1)" 2>/dev/null; then
              kill "$app_pid"
              wait "$app_pid" || true
              exit 0
            fi
            sleep 1
          done
          cat streamlit.log
          kill "$app_pid" 2>/dev/null || true
          exit 1
